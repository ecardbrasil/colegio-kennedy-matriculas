<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#008069" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202c33" media="(prefers-color-scheme: dark)">
<title>Colégio Kennedy</title>
<meta name="description" content="Colégio Kennedy, Sarandi, Porto Alegre. Matrículas 2027.">
<style>
:root{
  --topo:#008069; --topo-texto:#ffffff; --topo-suave:rgba(255,255,255,.78);
  --fundo:#efeae2; --pontos:#e3dccf;
  --bolha:#ffffff; --texto:#111b21; --hora:#667781;
  --chip:#ffffff; --chip-texto:#54656f;
  --acao:#00a884; --acao-texto:#ffffff; --botao2:#ffffff; --botao2-texto:#00a884;
  --rodape:#075e54; --rodape-texto:#ffffff;
  --avatar:#042c4b; --avatar-texto:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --topo:#202c33; --topo-texto:#e9edef; --topo-suave:#8696a0;
    --fundo:#0b141a; --pontos:#131f27;
    --bolha:#202c33; --texto:#e9edef; --hora:#8696a0;
    --chip:#182229; --chip-texto:#8696a0;
    --acao:#00a884; --acao-texto:#0b141a; --botao2:#202c33; --botao2-texto:#00a884;
    --rodape:#202c33; --rodape-texto:#e9edef;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.3;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;min-height:100dvh}

/* cabeçalho de conversa */
.topo{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px 10px;background:var(--topo);color:var(--topo-texto);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.voltar{width:24px;height:24px;flex:none;opacity:.95}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--avatar);color:var(--avatar-texto);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.topo b{display:block;font-size:17px;font-weight:600;line-height:1.15}
.topo small{display:block;color:var(--topo-suave);font-size:13px;line-height:1.2;min-height:15px}

/* fundo da conversa */
#chat{flex:1;display:flex;flex-direction:column;gap:3px;padding:12px 12px 8px;overflow-y:auto;background-color:var(--fundo);background-image:radial-gradient(var(--pontos) 1.2px,transparent 1.3px),radial-gradient(var(--pontos) 1.2px,transparent 1.3px);background-size:28px 28px;background-position:0 0,14px 14px}
.chip{align-self:center;background:var(--chip);color:var(--chip-texto);font-size:12.5px;font-weight:500;letter-spacing:.02em;padding:5px 11px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);margin:4px 0 8px;text-transform:uppercase}

/* balões recebidos */
.bolha{position:relative;align-self:flex-start;max-width:82%;background:var(--bolha);color:var(--texto);padding:6px 8px 5px 9px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);animation:entra .18s ease-out both}
.bolha.cauda{border-top-left-radius:0;margin-top:4px}
.bolha.cauda::before{content:"";position:absolute;top:0;left:-8px;width:8px;height:13px;background:var(--bolha);clip-path:polygon(100% 0,0 0,100% 100%)}
.bolha p{font-size:16px;line-height:1.3;padding-right:44px}
.bolha time{position:absolute;right:8px;bottom:4px;font-size:11px;color:var(--hora)}
.oculto{display:none}

/* digitando */
.digitando{align-self:flex-start;display:inline-flex;gap:4px;align-items:center;background:var(--bolha);padding:12px 13px;border-radius:8px;border-top-left-radius:0;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.digitando i{width:7px;height:7px;border-radius:50%;background:var(--hora);animation:pula .7s infinite}
.digitando i:nth-child(2){animation-delay:.12s}
.digitando i:nth-child(3){animation-delay:.24s}
@keyframes pula{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* botões (como botões de resposta do WhatsApp Business) */
.acoes{display:flex;flex-direction:column;gap:8px;padding:6px 12px 12px;background:var(--fundo)}
.acoes.entra{animation:entra .25s ease-out both}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;border-radius:24px;text-decoration:none;font-weight:600;font-size:16.5px;-webkit-tap-highlight-color:transparent;box-shadow:0 1px .5px rgba(11,20,26,.18)}
.btn svg{width:21px;height:21px;flex:none}
.btn.wpp{background:var(--acao);color:var(--acao-texto)}
.btn.insta{background:var(--botao2);color:var(--botao2-texto)}
.btn:active{filter:brightness(.94)}
.btn:focus-visible{outline:3px solid #53bdeb;outline-offset:2px}

/* rodapé */
.rodape{padding:11px 16px calc(11px + env(safe-area-inset-bottom));text-align:center;background:var(--rodape);color:var(--rodape-texto);font-weight:700;letter-spacing:.07em;font-size:15px}
.rodape small{display:block;font-weight:500;letter-spacing:0;font-size:12px;opacity:.85;margin-top:2px}
@media (prefers-reduced-motion:reduce){.bolha,.acoes.entra{animation:none}.digitando i{animation:none}}
</style>
</head>
<body>
<header class="topo">
  <svg class="voltar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  <div class="avatar" aria-hidden="true">CK</div>
  <div><b>Colégio Kennedy</b><small id="status">Colégio · Sarandi, Porto Alegre</small></div>
</header>

<main id="chat" aria-live="polite">
  <div class="chip">Hoje</div>
  <div class="bolha cauda" data-msg><p data-saudacao>Olá, vizinho!</p><time></time></div>
  <div class="bolha" data-msg><p>Eu sou o Colégio Kennedy. Moro aqui pertinho há 58 anos.</p><time></time></div>
  <div class="bolha" data-msg><p>Como eu te ajudo hoje?</p><time></time></div>
</main>

<nav class="acoes" id="acoes" aria-label="Escolha como falar com a gente">
  <a class="btn wpp" id="b-wpp" data-botao="whatsapp" href="https://wa.me/555133641142?text=Ol%C3%A1!%20Vi%20o%20v%C3%ADdeo%20no%20tel%C3%A3o%20e%20gostaria%20de%20saber%20mais%20informa%C3%A7%C3%B5es.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.500 8.500 0 0 1-12.300 7.600L3 21l1.500-5.500A8.500 8.500 0 1 1 21 12Z"/><path d="M9 10h6M9 14h4"/></svg>
    Continuar conversa no WhatsApp
  </a>
  <a class="btn insta" id="b-insta" data-botao="instagram" href="https://www.instagram.com/colegiokennedypoa/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".6" fill="currentColor"/></svg>
    Ver o Instagram da escola
  </a>
</nav>

<footer class="rodape">ÚLTIMAS VAGAS para 2027<small>Av. Alcides S. Severiano, 99 · Sarandi</small></footer>

<script>
(function () {
  var ENDPOINT = 'https://n8n.colegiokennedy.top/webhook/telao-acesso';
  var t0 = Date.now();

  // ---------- saudação e horário (relógio do aparelho) ----------
  var agora = new Date(), h = agora.getHours();
  var saudacao = h >= 5 && h < 12 ? 'Bom dia' : (h >= 12 && h < 18 ? 'Boa tarde' : 'Boa noite');
  var hhmm = ('0' + h).slice(-2) + ':' + ('0' + agora.getMinutes()).slice(-2);
  var chat = document.getElementById('chat'), acoes = document.getElementById('acoes'), status = document.getElementById('status');
  var parado = status.textContent;
  var bolhas = Array.prototype.slice.call(chat.querySelectorAll('[data-msg]'));
  bolhas[0].querySelector('[data-saudacao]').textContent = saudacao + ', vizinho!';
  bolhas.forEach(function (b) { b.querySelector('time').textContent = hhmm; });

  // ---------- registro de acesso e clique (sem nome, telefone nem IP) ----------
  function aleatorio() {
    var s = '', i, c = 'abcdefghijklmnopqrstuvwxyz0123456789';
    for (i = 0; i < 16; i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return s;
  }
  var visitante = { id: aleatorio(), novo: true };
  try {
    var guardado = localStorage.getItem('ckv');
    if (guardado && /^[a-z0-9]{8,32}$/i.test(guardado)) { visitante = { id: guardado, novo: false }; }
    else { localStorage.setItem('ckv', visitante.id); }
  } catch (e) {}

  var ua = navigator.userAgent || '';
  var aparelho = /iPad|Tablet/i.test(ua) ? 'tablet' : (/Mobi|Android|iPhone|iPod/i.test(ua) ? 'celular' : 'computador');
  var so = /Android/i.test(ua) ? 'Android' : (/iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Windows/i.test(ua) ? 'Windows' : (/Mac/i.test(ua) ? 'Mac' : (/Linux/i.test(ua) ? 'Linux' : 'outro'))));
  var cx = navigator.connection || {};
  var ref = '';
  try { ref = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
  var codigo = '';
  try { codigo = (new URLSearchParams(location.search).get('c') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); } catch (e) {}

  function enviar(tipo, botao) {
    var p = {
      tipo: tipo, vid: visitante.id, novo: visitante.novo ? '1' : '0', c: codigo, ap: aparelho, so: so,
      net: cx.effectiveType || '', tela: (screen.width || 0) + 'x' + (screen.height || 0),
      lang: navigator.language || '', ref: ref
    };
    if (botao) { p.botao = botao; p.seg = Math.round((Date.now() - t0) / 1000); }
    var q = [], k;
    for (k in p) { if (p.hasOwnProperty(k)) q.push(k + '=' + encodeURIComponent(p[k])); }
    var url = ENDPOINT + '?' + q.join('&');
    try {
      if (window.fetch) { fetch(url, { mode: 'no-cors', keepalive: true }); return; }
    } catch (e) {}
    try { new Image().src = url; } catch (e) {}
  }
  enviar('acesso');
  Array.prototype.forEach.call(document.querySelectorAll('[data-botao]'), function (a) {
    a.addEventListener('click', function () { enviar('clique', a.getAttribute('data-botao')); });
  });

  // ---------- conversa que aparece rápido ----------
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  bolhas.forEach(function (b) { b.classList.add('oculto'); });
  acoes.classList.add('oculto');
  var ponto = document.createElement('div');
  ponto.className = 'digitando'; ponto.setAttribute('aria-hidden', 'true');
  ponto.innerHTML = '<i></i><i></i><i></i>';

  var i = 0;
  function proxima() {
    if (i >= bolhas.length) {
      status.textContent = parado;
      acoes.classList.remove('oculto'); acoes.classList.add('entra');
      return;
    }
    status.textContent = 'digitando...';
    chat.insertBefore(ponto, bolhas[i]);
    var espera = i === 0 ? 450 : 600;
    setTimeout(function () {
      if (ponto.parentNode) ponto.parentNode.removeChild(ponto);
      bolhas[i].classList.remove('oculto');
      i++;
      setTimeout(proxima, 120);
    }, espera);
  }
  proxima();
})();
</script>
<noscript><style>.oculto{display:block!important}</style></noscript>
</body>
</html>
