<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Agenda de visitas, Colégio Kennedy</title>
  <link rel="icon" href="/assets/images/favicon.webp" type="image/webp" />
  <link rel="stylesheet" href="/visitas/visitas.css?v=9" />
</head>
<body>
  <header class="topo">
    <h1>Agenda de visitas</h1>
    <div class="topo-acoes">
      <button type="button" class="btn-atualizar" id="btnAtualizar">Atualizar</button>
      <button type="button" class="btn-sair" id="btnSair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div class="abas">
      <button type="button" class="aba-btn aba-proximas ativa" id="abaProximas">Próximas visitas</button>
      <button type="button" class="aba-btn aba-encerradas" id="abaEncerradas">Visitas encerradas</button>
    </div>

    <div class="visao-alternar" role="group" aria-label="Forma de exibir a agenda">
      <button type="button" class="visao-btn ativa" id="visaoLista" aria-pressed="true">Lista</button>
      <button type="button" class="visao-btn" id="visaoCalendario" aria-pressed="false">Calendário</button>
    </div>

    <p class="mensagem-carregando" id="mensagemCarregando">Carregando agenda...</p>
    <p class="mensagem-vazia" id="mensagemVazia" hidden>Nenhuma visita nesta categoria.</p>
    <div class="mensagem-erro-tela" id="mensagemErroTela" hidden>
      <p id="textoErroCarregamento">Não foi possível carregar a agenda. Verifique a internet.</p>
      <button type="button" class="btn-primario" id="btnTentarNovamente">Tentar novamente</button>
    </div>
    <div class="calendario-agenda" id="calendarioAgenda" hidden></div>
    <ul class="lista-agenda" id="listaAgenda"></ul>
  </main>

  <script src="/visitas/auth.js?v=3"></script>
  <script src="/visitas/cronometro.js?v=2"></script>
  <script src="/visitas/agenda.js?v=8" defer></script>
</body>
</html>
