<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Visitas, Colégio Kennedy</title>
  <link rel="icon" href="../assets/images/favicon.webp" type="image/webp" />
  <link rel="stylesheet" href="visitas.css?v=1" />
</head>
<body>
  <main class="tela-login">
    <div class="card-login">
      <h1>Visitas Kennedy</h1>
      <p class="subtitulo">Digite a senha para acessar a agenda de visitas.</p>
      <form id="formLogin" autocomplete="off">
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required autofocus />
        </div>
        <button type="submit" class="btn-primario" id="btnEntrar">Entrar</button>
      </form>
      <p class="mensagem-erro" id="mensagemErro"></p>
    </div>
  </main>

  <script>
    var formLogin = document.getElementById('formLogin');
    var btnEntrar = document.getElementById('btnEntrar');
    var mensagemErro = document.getElementById('mensagemErro');
    var campoSenha = document.getElementById('senha');

    formLogin.addEventListener('submit', function (evento) {
      evento.preventDefault();
      mensagemErro.textContent = '';
      btnEntrar.disabled = true;
      btnEntrar.textContent = 'Entrando...';

      fetch('/api/visitas/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: campoSenha.value }),
      })
        .then(function (res) {
          if (res.ok) {
            window.location.href = '/visitas/index.html';
            return;
          }
          if (res.status === 401) {
            mensagemErro.textContent = 'Senha incorreta. Tente novamente.';
          } else {
            mensagemErro.textContent = 'Não foi possível entrar agora. Tente novamente em instantes.';
          }
          btnEntrar.disabled = false;
          btnEntrar.textContent = 'Entrar';
        })
        .catch(function () {
          mensagemErro.textContent = 'Falha de conexão. Verifique a internet e tente novamente.';
          btnEntrar.disabled = false;
          btnEntrar.textContent = 'Entrar';
        });
    });
  </script>
</body>
</html>
